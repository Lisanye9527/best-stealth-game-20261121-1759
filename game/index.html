<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Vault — a tiny stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 38%, #0d1224 0%, #07090f 70%);
  }
  #game {
    display: block; touch-action: none;
    width: min(97vw, 141.8vh); height: auto;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px #232c47;
    border-radius: 6px;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="660" aria-label="Quiet Vault: sneak the courier through a lamplit archive, dodge the wardens' lamp cones and reach the exit door unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
