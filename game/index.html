<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Vault — a tiny stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e14; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #9aa3b2;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 96vw;
    max-height: 86vh;
    background: #0b0e14;
    border: 1px solid #2c3242;
  }
  p { margin: 12px 0 0; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p>Quiet Vault — WASD or arrows to move, Shift to sneak, R to restart the floor.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
